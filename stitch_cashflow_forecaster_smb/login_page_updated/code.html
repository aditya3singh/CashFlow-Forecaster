<input class="w-full bg-surface-card border border-border-subtle rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-text-primary" for="password">Password</label>
<input class="w-full bg-surface-card border border-border-subtle rounded-lg px-4 py-3 font-body-md text-body-md text-text-primary focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer">
<input class="rounded border-border-subtle text-secondary focus:ring-secondary w-4 h-4 cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-text-muted text-sm">Remember me</span>
</label>
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors text-sm" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md rounded-lg py-3 mt-2 hover:opacity-90 active:opacity-80 transition-opacity" type="button">
                    Log in
