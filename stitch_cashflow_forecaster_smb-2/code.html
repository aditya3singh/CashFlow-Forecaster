        function closePanel() {

            panel.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            
            backdrop.style.opacity = '0';
            backdrop.style.transition = 'opacity 0.3s ease';

            }, 300);
